<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0b4f8f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="PSE System">
  <title>Log Masuk — PSE System</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="icon" href="/icons/icon-192.png" type="image/png">
  <link rel="stylesheet" href="/css/system.css">
</head>
<body class="login-page">
  <div class="login-card">
    <img src="/assets/logo.png" alt="PSE" class="login-logo" onerror="this.style.display='none'">
    <h1>Pillar Stride Enterprise</h1>
    <p class="login-sub">Sistem Sebutharga & Invois</p>
    <p id="offlineLoginHint" class="login-hint" hidden>Mode offline sedia — guna akaun yang pernah log masuk di telefon ini.</p>
    <form id="loginForm">
      <label>Username</label>
      <input type="text" id="username" value="admin" required autocomplete="username">
      <label>Kata Laluan</label>
      <input type="password" id="password" value="pse2026" required autocomplete="current-password">
      <p id="loginError" class="error-msg" hidden></p>
      <button type="submit" class="btn btn-primary btn-block">Log Masuk</button>
    </form>
    <p class="login-hint">Default: admin / pse2026</p>
    <p class="login-hint login-pwa-hint">iPhone: Safari → Kongsi → <strong>Tambah ke Skrin Utama</strong> untuk guna offline.</p>
  </div>
  <script src="/js/offline.js"></script>
  <script src="/js/api.js"></script>
  <script>
    Offline.installBanner();
    if (!navigator.onLine && Offline.hasOfflineBundle()) {
      document.getElementById('offlineLoginHint').hidden = false;
    }

    (async () => {
      try {
        const d = await API.get('/auth/check');
        if (d.authenticated) location.href = '/app.html';
      } catch { /* stay on login */ }
    })();

    document.getElementById('loginForm').addEventListener('submit', async e => {
      e.preventDefault();
      const err = document.getElementById('loginError');
      err.hidden = true;
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;
      try {
        const data = await API.post('/auth/login', { username, password });
        if (data.user) Offline.setSession(data.user);
        Offline.saveCreds(username, password);
        location.href = '/app.html';
      } catch (ex) {
        err.textContent = ex.message || 'Log masuk gagal.';
        err.hidden = false;
      }
    });
  </script>
</body>
</html>
